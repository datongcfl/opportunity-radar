<!doctype html>
<html lang="zh-CN" data-theme="stone-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>商机嗅探器 · 无界空间推演台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/desk/tokens.css">
</head>
<body>

  <!-- Top Floating Command Capsule + Active Desk Bookmarks -->
  <header class="top-bar-float">
    <div class="capsule">
      <span class="brand-title">商机嗅探器</span>
      <button class="cmd-btn" id="openPaletteBtn" title="召唤新行业或从归档柜恢复 (Ctrl+K)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
        </svg>
        <span>请上桌面 / 归档柜（<span id="cabinetBadge">词库 771</span>）</span>
        <span class="kbd">⌘K</span>
      </button>
    </div>

    <nav class="origin-tabs" id="originTabs" aria-label="桌面当前行业书签"></nav>

    <div class="capsule" style="padding:0 6px;">
      <button class="pill-btn primary" id="exportBriefBtn" title="导出当前分支的行动清单与 radar 待补证据简报">导出行动简报</button>
    </div>
  </header>

  <!-- 96% Frameless Infinite Spatial Desk -->
  <main id="desk">
    <div id="world" data-lod="detail">
      <svg id="edgesSvg" viewBox="-6000 -6000 12000 12000"></svg>
      <div id="edgePills"></div>
      <div id="cardsLayer"></div>
    </div>
  </main>

  <div id="marqueeBox"></div>

  <!-- Bottom-Left Workflow Filter & Hint Bar -->
  <div class="bottom-left-bar">
    <button class="filter-chip" id="starFilterBtn">★ 只看重点深挖</button>
    <span style="opacity:.35">|</span>
    <span>双击卡片原位精修 · 点 RADAR 徽标查看模块覆盖矩阵 · 底部圆点拖拉跨界桥</span>
  </div>

  <!-- Bottom-Right Minimap + Astryx Theme & Layout Dock -->
  <div class="bottom-right-stack">
    <canvas id="minimapCanvas" class="minimap" width="148" height="92" title="缩略导航雷达：点击任意位置快速跳转"></canvas>
    <div class="dock">
      <button class="dock-btn" id="undoBtn" title="撤销 (Ctrl+Z)">撤回</button>
      <button class="dock-btn" id="redoBtn" title="重做 (Ctrl+Shift+Z)">重做</button>
      <button class="dock-btn" id="tidyLayoutBtn" title="树状防碰撞自动理顺排布">理顺排布</button>
      <select class="dock-select" id="themeSelect" title="Meta Astryx 语义主题切换">
        <option value="stone-dark">矿石暗夜</option>
        <option value="stone-light">温润矿纸</option>
        <option value="matcha">静谧抹茶</option>
        <option value="neutral-dark">中性蓝调</option>
      </select>
      <button class="dock-btn" id="zoomOutBtn">−</button>
      <button class="dock-btn" id="zoomReadout" title="自适应全局视角">85%</button>
      <button class="dock-btn" id="zoomInBtn">+</button>
      <a class="dock-btn" href="/experience.html" title="独立本地办事经验模块">本地经验 ↗</a>
    </div>
  </div>

  <!-- Command Palette Modal (Cabinet + 771 Dictionary) -->
  <div class="modal-backdrop" id="paletteModal">
    <div class="modal-box">
      <input class="palette-input" id="paletteInput" placeholder="搜索 771 行业请上桌，或从归档柜恢复历史推演树…" autocomplete="off">
      <div class="palette-list" id="paletteList"></div>
    </div>
  </div>

  <!-- Live Radar Coverage Matrix & Source Ledger Modal -->
  <div class="modal-backdrop" id="radarModal">
    <div class="radar-modal-box">
      <div class="radar-head">
        <div>
          <div style="font-size:15.5px;font-weight:700;" id="radarModalTitle">radar 行业证据审计矩阵</div>
          <div style="font-size:11.5px;color:var(--color-text-secondary);" id="radarModalSub">按模块核查真凭实据与缺口</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <select class="form-select" id="radarPackSelect" style="width:auto;margin:0;padding:5px 10px;font-size:12px;"></select>
          <button class="pill-btn" id="radarProbeModeBtn" title="把当前画布分支一键翻译成 radar pack.json 并启动首轮搜证">新建探针</button>
          <button class="pill-btn primary" id="radarRunBtn">运行 radar 重算</button>
          <button class="pill-btn" id="radarCloseBtn">关闭</button>
        </div>
      </div>
      <div class="radar-summary-bar" id="radarSummaryBar">加载中…</div>
      <div class="radar-tabs">
        <button class="radar-tab active" data-rtab="matrix">模块×子系统覆盖矩阵</button>
        <button class="radar-tab" data-rtab="claims">商业主张核验 (Claims)</button>
        <button class="radar-tab" data-rtab="sources">已核验来源账本</button>
        <button class="radar-tab" data-rtab="gaps">空白与单源缺口 (gaps.md)</button>
      </div>
      <div class="radar-body" id="radarBody"></div>
    </div>
  </div>

  <!-- Export Action & Radar Evidence Brief Modal -->
  <div class="modal-backdrop" id="briefModal">
    <div class="modal-box" style="padding:18px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div>
          <div style="font-size:15px;font-weight:700;">商机行动清单与 radar 待核实证据简报</div>
          <div style="font-size:11.5px;color:var(--color-text-secondary);">可直接粘贴至文档执行，或交由 radar / Agent 定向补齐空白证据</div>
        </div>
      </div>
      <textarea class="form-textarea" id="briefTextarea" rows="13" style="font-family:var(--font-mono);font-size:11.5px;line-height:1.55;"></textarea>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px;">
        <button class="pill-btn" id="closeBriefBtn">关闭</button>
        <button class="pill-btn primary" id="copyBriefBtn">复制 Markdown 简报</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="/desk/desk-app.js"></script>
</body>
</html>
