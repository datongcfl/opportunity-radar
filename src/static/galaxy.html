<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商机嗅探器 · 行业星空原型</title><link rel="icon" href="data:,"><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.79.0/dist/3d-force-graph.min.js"></script><style>
:root{--ink:#f2f0e8;--muted:rgba(226,232,229,.58);--line:rgba(226,232,229,.16);--gold:#f1d992;--cyan:#9ed9da;--bg:#020506}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}#galaxy{position:fixed;inset:0;background:radial-gradient(circle at 50% 48%,#0c191a 0,#04090a 35%,#010304 76%)}#galaxy canvas{display:block}.top{position:fixed;z-index:4;top:0;left:0;right:0;height:72px;padding:17px 22px;display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,rgba(1,3,4,.78),transparent);pointer-events:none}.brand{font-size:14px;font-weight:700;letter-spacing:.08em}.phase{font:10px ui-monospace,monospace;letter-spacing:.12em;color:var(--cyan);border:1px solid rgba(158,217,218,.32);padding:4px 8px;border-radius:4px}.top .space{flex:1}.count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}.intro{position:fixed;z-index:4;left:24px;top:95px;width:min(360px,calc(100vw - 48px));pointer-events:none}.intro small{display:block;font:10px ui-monospace,monospace;color:var(--cyan);letter-spacing:.2em;margin-bottom:10px}.intro h1{font-size:30px;line-height:1.2;margin:0 0 9px;font-weight:620;letter-spacing:0}.intro p{font-size:12px;line-height:1.8;color:var(--muted);margin:0}.legend{position:fixed;z-index:4;left:24px;bottom:23px;display:flex;gap:18px;color:var(--muted);font-size:11px;pointer-events:none}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}.dot.claimed{background:var(--gold);box-shadow:0 0 14px var(--gold)}.dot.pending{background:var(--cyan);box-shadow:0 0 9px rgba(158,217,218,.6)}.reset{position:fixed;z-index:5;right:24px;top:92px;border:1px solid var(--line);background:rgba(7,13,14,.62);color:var(--muted);padding:8px 11px;border-radius:5px;font:11px inherit;cursor:pointer}.reset:hover{color:var(--ink);border-color:rgba(158,217,218,.6)}.controls{position:fixed;z-index:4;right:24px;bottom:22px;text-align:right;color:rgba(226,232,229,.38);font-size:10px;line-height:1.9;pointer-events:none}.detail,.drawer{position:fixed;z-index:8;background:rgba(7,13,14,.9);border:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:0 24px 70px rgba(0,0,0,.55)}.detail{right:24px;top:92px;width:300px;padding:20px;transform:translateX(340px);opacity:0;transition:.42s cubic-bezier(.2,.8,.2,1)}.detail.show{transform:none;opacity:1}.detail small{color:var(--cyan);font:10px ui-monospace,monospace;letter-spacing:.15em}.detail h2{font-size:23px;margin:10px 0 8px}.detail p{font-size:12px;line-height:1.75;color:var(--muted);min-height:42px}.action{width:100%;margin-top:11px;padding:11px 14px;border:0;border-radius:5px;background:var(--ink);color:#081011;font-weight:700;cursor:pointer}.drawer{top:0;right:0;width:min(390px,100vw);height:100%;padding:26px;transform:translateX(105%);transition:.45s cubic-bezier(.2,.8,.2,1)}.drawer.show{transform:none}.drawer h2{font-size:22px;margin:42px 0 5px}.drawer .sub{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:22px}.close{position:absolute;right:20px;top:18px;border:0;background:none;color:var(--muted);font-size:21px;cursor:pointer}.drawer label{display:block;font-size:11px;color:var(--muted);margin:14px 0 6px}.drawer input,.drawer textarea{width:100%;border:1px solid var(--line);border-radius:5px;background:rgba(0,0,0,.32);color:var(--ink);padding:10px 11px;font:13px inherit;outline:none}.drawer input:focus,.drawer textarea:focus{border-color:rgba(158,217,218,.7)}.drawer textarea{min-height:74px;resize:vertical}.toast{position:fixed;z-index:20;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;padding:9px 16px;border:1px solid var(--line);background:rgba(7,13,14,.92);font-size:12px;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.loading{position:fixed;z-index:15;inset:0;display:grid;place-items:center;background:#020506;color:var(--muted);font:11px ui-monospace,monospace;letter-spacing:.18em;transition:.5s}.loading.done{opacity:0;pointer-events:none}@media(max-width:700px){.intro{top:80px}.intro h1{font-size:24px}.detail{right:12px;top:auto;bottom:76px;width:calc(100% - 24px)}.legend{left:14px;bottom:17px;gap:12px}.controls{display:none}.top{padding:14px}.count{display:none}}
</style></head><body><main id="galaxy"></main><header class="top"><div class="brand">商机嗅探器</div><div class="phase">INDUSTRY UNIVERSE</div><div class="space"></div><div class="count"><span id="claimedCount">0</span> 已认领&nbsp;&nbsp;/&nbsp;&nbsp;<span id="pendingCount">0</span> 待认领</div></header><section class="intro"><small>OPPORTUNITY GALAXY</small><h1>选择一颗行业星</h1><p>每颗星星都是一个行业。明亮星体已有人建设，冷色星体等待第一位探索者。</p></section><div class="legend"><span><i class="dot claimed"></i>已认领</span><span><i class="dot pending"></i>待认领</span></div><button id="resetView" class="reset">复位视角</button><div class="controls">拖动旋转星空 · 滚轮穿行<br>悬停识别行业 · 点击靠近</div><aside id="detail" class="detail"></aside><aside id="drawer" class="drawer"><button class="close" id="closeDrawer">×</button><small>CLAIM INDUSTRY</small><h2 id="claimTitle">认领行业星</h2><div class="sub">认领不是占有，而是为这个行业建立第一条可验证的商机路径。</div><label>行业名称</label><input id="industryName" readonly><label>第一条变现路径 *</label><input id="firstTouch" maxlength="30" placeholder="例如：为小店提供 AI 菜单生成"><label>为什么值得探索</label><textarea id="industryNote" maxlength="300" placeholder="写下你观察到的需求或变化"></textarea><label>署名</label><input id="author" maxlength="20" placeholder="匿名"><button class="action" id="submitClaim">认领并点亮</button></aside><div id="toast" class="toast"></div><div id="loading" class="loading">正在进入行业宇宙</div><script src="/galaxy-prototype.js"></script></body></html>
